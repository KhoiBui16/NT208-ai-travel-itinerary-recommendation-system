name: Frontend CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'style/**'
      - 'refactor/**'
      - 'chore/**'

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Frontend/package.json ]]; then
            cd Frontend
            npm ci
          else
            echo "No Frontend/package.json found. Skipping install."
          fi

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Frontend/package.json ]]; then
            cd Frontend
            npm run build
          else
            echo "No Frontend/package.json found. Skipping build."
          fi

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_db"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
      FRONTEND_URL: "http://localhost:5173"
      GEMINI_API_KEY: "dummy-ci-key"
      GOONG_API_KEY: "dummy-ci-key"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install backend and run migrations
        shell: bash
        run: |
          set -euo pipefail
          cd Backend
          uv sync --frozen --dev
          uv run alembic upgrade head

      - name: Start backend server
        shell: bash
        run: |
          cd Backend
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -s http://localhost:8000/api/v1/health || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: cd Frontend && npm ci

      - name: Install Playwright browsers
        shell: bash
        run: cd Frontend && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        shell: bash
        run: cd Frontend && npx playwright test
        env:
          E2E_API_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 7
